<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UPD Records Bureau · Consulta de Autenticidade</title>
  <link rel="icon" type="image/png" href="./assets/opacidade2.png" />
  <link rel="stylesheet" href="./style.css?v=8" />
  <script src="./config.js?v=8"></script>
  <style>
    @media print {
      body {
        background: #ffffff !important;
        padding: 0 !important;
        margin: 0 !important;
      }
      .no-print,
      .page-header,
      #verify-search-panel,
      .verify-actions-bar,
      #verify-caption,
      .panel-summary-only {
        display: none !important;
      }
      .canvas {
        max-width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
      }
      .sheet-stage-verify {
        display: block !important;
        padding: 0 !important;
        margin: 0 !important;
      }
      .us-letter-sheet {
        box-shadow: none !important; /* taste-skill-ignore */
        border: 1px solid #111e38 !important;
        margin: 0 auto !important;
        page-break-inside: avoid !important;
        break-inside: avoid !important;
      }
    }

    .sheet-stage-verify {
      display: flex;
      justify-content: center;
      margin-top: 24px;
      margin-bottom: 40px;
    }

    .verify-actions-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }

    .doc-full-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 28px;
      margin-bottom: 12px;
    }

    .doc-full-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }
  </style>
</head>
<body>
  <main class="canvas" style="max-width:860px;margin:0 auto;padding-top:36px;padding-bottom:60px;">
    <div class="page-header no-print">
      <div style="display:flex;align-items:center;gap:14px;">
        <img src="./assets/opacidade2.png" alt="UPD Crest" style="width:48px;height:48px;object-fit:contain;" />
        <div>
          <h1 class="page-title" id="page-title">Consulta de Autenticidade</h1>
          <p class="page-sub" id="page-sub">Unified Police Department · Los Santos</p>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;">
        <button class="btn btn-secondary" id="btn-verify-lang" type="button" style="font-weight:600;">PT</button>
        <a class="btn btn-secondary" id="btn-back" href="./index.html">Voltar ao Portal</a>
      </div>
    </div>

    <section class="panel no-print" id="verify-search-panel">
      <form id="verify-form" style="display:flex;gap:10px;align-items:center;">
        <input
          class="input mono"
          id="verify-input"
          placeholder="Nº de Controle (ex: UPD-SW-2026-0001)"
          required
        />
        <button class="btn btn-primary" id="btn-submit-verify" type="submit">Consultar</button>
      </form>
      <div id="verify-caption" style="margin-top:10px;font-size:13px;color:var(--muted);line-height:1.5;">
        Consulte a autenticidade de mandados e certidões emitidos pelo bureau.
      </div>
    </section>

    <div id="verify-result"></div>
  </main>

  <script type="module">
    import { fetchPublicVerifyRecord, store, pullSharedStore } from "./api.js?v=8";
    import { t, getLanguage, setLanguage } from "./i18n.js?v=8";
    import { buildLiveSheetHtml, esc, getSiteVerifyUrl } from "./sheet-renderer.js?v=8";

    const input = document.getElementById("verify-input");
    const resultBox = document.getElementById("verify-result");
    const langBtn = document.getElementById("btn-verify-lang");

    function copyToClipboard(text, btn) {
      const orig = btn.innerHTML;
      const done = () => {
        btn.innerHTML = "Copiado";
        setTimeout(() => { btn.innerHTML = orig; }, 1800);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done).catch(() => window.prompt("Copie o link:", text));
      } else {
        window.prompt("Copie o link:", text);
      }
    }

    function updateStaticTexts() {
      const lang = getLanguage();
      langBtn.textContent = lang === "pt" ? "PT" : "EN";
      document.getElementById("page-title").textContent = t("qrTitle");
      document.getElementById("page-sub").textContent = t("qrSub");
      document.getElementById("btn-back").textContent = t("backToPortal");
      input.placeholder = t("qrPlaceholder");
      document.getElementById("btn-submit-verify").textContent = t("btnVerify");
      document.getElementById("verify-caption").textContent = lang === "pt"
        ? "Consulte a autenticidade de mandados e certidões emitidos pelo bureau."
        : "Verify official warrants and certificates issued by the bureau.";
    }

    langBtn.addEventListener("click", () => {
      setLanguage(getLanguage() === "pt" ? "en" : "pt");
      updateStaticTexts();
      if (input.value) runVerification(input.value);
    });

    async function runVerification(ctrlNo) {
      const code = (ctrlNo || "").trim().toUpperCase();
      if (!code) return;
      input.value = code;
      const lang = getLanguage();
      const isPt = lang === "pt";

      resultBox.innerHTML = `
        <div style="text-align:center;padding:36px;color:var(--muted);">
          <div style="font-weight:600;margin-bottom:6px;">${isPt ? "Consultando Registro Oficial..." : "Consulting Registry..."}</div>
          <div style="font-size:13px;">Unified Police Department · ${esc(code)}</div>
        </div>
      `;

      let rec = null;
      try {
        rec = await fetchPublicVerifyRecord(code);
      } catch (err) {
        console.warn("fetchPublicVerifyRecord error:", err);
      }

      if (!rec) {
        resultBox.innerHTML = `
          <section class="panel" style="border-color:#f8c6c0;">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
              <h2 class="panel-title">${esc(t("recordNotFound"))}</h2>
              <span class="pill pill-rejected">${isPt ? "NÃO ENCONTRADO" : "NOT FOUND"}</span>
            </div>
            <p style="margin:0;color:var(--muted);line-height:1.5;">
              ${esc(t("notFoundDesc", { code }))}
            </p>
          </section>
        `;
        return;
      }

      const isValid = rec.status === "APPROVED";
      const fullVerifyUrl = getSiteVerifyUrl(rec.control_no);

      let sheetHtml = "";
      if (rec.template && rec.doc) {
        sheetHtml = buildLiveSheetHtml(
          rec.template,
          rec.data_json || rec.doc.data_json || {},
          {
            issuer: {
              rp_name: rec.doc.issuer_name,
              badge: rec.doc.issuer_badge,
              rank_name: rec.doc.issuer_rank,
              division: rec.doc.issuer_division
            },
            approver_name: rec.doc.approver_name,
            approver_badge: rec.doc.approver_badge,
            approver_rank: rec.doc.approver_rank,
            status: rec.status,
            control_no: rec.control_no,
            approved_at: rec.approved_at,
            created_at: rec.doc.created_at,
            lang: rec.lang || rec.doc.lang || "pt"
          }
        );
      }

      resultBox.innerHTML = `
        <section class="panel panel-summary-only">
          <div class="panel-header">
            <div style="display:flex;align-items:center;gap:14px;">
              <img src="./assets/selo.png" alt="Official Seal" style="width:52px;height:52px;object-fit:contain;" />
              <div>
                <h2 class="panel-title mono" style="font-size:17px;">${esc(rec.control_no)}</h2>
                <div class="panel-sub" style="font-size:13px;font-weight:600;color:var(--navy);">${esc(rec.document_title)}</div>
              </div>
            </div>
            <span class="pill ${isValid ? "pill-approved" : "pill-revoked"}">
              ${isValid ? esc(t("verifiedValid")) : esc(rec.status)}
            </span>
          </div>

          <table class="data-table">
            <tbody>
              <tr>
                <th style="width:230px;">${isPt ? "Nº de Controle" : "Control No."}</th>
                <td class="mono" style="font-weight:600;color:var(--navy);">${esc(rec.control_no)}</td>
              </tr>
              <tr>
                <th>${isPt ? "Classificação" : "Classification"}</th>
                <td>${rec.category === "doj" ? (isPt ? "Processo Judicial (DOJ)" : "Judicial Filing (DOJ)") : (isPt ? "Registro Interno (UPD)" : "Internal Record (UPD)")}</td>
              </tr>
              <tr>
                <th>${isPt ? "Oficial Emissor" : "Issuing Officer"}</th>
                <td>${esc(rec.issued_by)}</td>
              </tr>
              <tr>
                <th>${isPt ? "Autoridade de Comando" : "Command Authority"}</th>
                <td>${esc(rec.approved_by || (isPt ? "Pendente" : "Pending"))}</td>
              </tr>
              <tr>
                <th>${isPt ? "Idioma do Documento" : "Document Language"}</th>
                <td>${(rec.lang || "pt") === "en" ? "English" : "Português"}</td>
              </tr>
              <tr>
                <th>${isPt ? "Data de Autenticação" : "Authentication Date"}</th>
                <td class="mono">${esc((rec.approved_at || "").slice(0, 19).replace("T", " "))} UTC</td>
              </tr>
              <tr>
                <th>${isPt ? "Link de Verificação" : "Verification URL"}</th>
                <td class="mono" style="word-break:break-all;"><a href="${esc(fullVerifyUrl)}" style="color:var(--navy);text-decoration:underline;">${esc(fullVerifyUrl)}</a></td>
              </tr>
              ${
                rec.png_url
                  ? `<tr><th>${isPt ? "Imagem Oficial" : "Official Image"}</th><td><a href="${esc(rec.png_url)}" target="_blank" rel="noopener" class="mono" style="color:var(--accent);text-decoration:underline;word-break:break-all;">${esc(rec.png_url)}</a></td></tr>`
                  : ""
              }
              ${
                rec.revocation_note
                  ? `<tr><th>${isPt ? "Aviso de Revogação" : "Revocation Notice"}</th><td style="color:var(--negative);font-weight:600;">${esc(rec.revocation_note)}</td></tr>`
                  : ""
              }
            </tbody>
          </table>

          <div class="verify-actions-bar no-print">
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
              <button class="btn btn-primary" id="btn-print-doc" type="button">
                ${isPt ? "Imprimir / PDF" : "Print / PDF"}
              </button>
              <button class="btn btn-secondary" id="btn-copy-url" type="button">
                ${isPt ? "Copiar Link" : "Copy Link"}
              </button>
              ${
                rec.png_url
                  ? `<a class="btn btn-secondary" href="${esc(rec.png_url)}" target="_blank" rel="noopener">
                      ${isPt ? "Ver Imagem" : "View Image"}
                    </a>`
                  : ""
              }
            </div>
            <div style="font-size:13px;color:var(--muted);">
              ${isPt ? "Registro autenticado e arquivado." : "Authenticated record."}
            </div>
          </div>
        </section>

        ${
          sheetHtml
            ? `
              <div class="doc-full-header no-print">
                <div class="doc-full-title">
                  ${isPt ? "Folha Oficial do Registro" : "Official Record Document"}
                </div>
                <div style="font-size:12px;color:var(--muted);">
                  US Letter (8.5 × 11 in)
                </div>
              </div>

              <div class="sheet-stage-verify">
                ${sheetHtml}
              </div>
            `
            : rec.png_url
            ? `
              <div class="doc-full-header no-print">
                <div class="doc-full-title">
                  ${isPt ? "Imagem Oficial Registrada" : "Registered Official Image"}
                </div>
              </div>
              <div style="text-align:center;margin-top:16px;">
                <img src="${esc(rec.png_url)}" alt="Official Document" style="max-width:100%;border-radius:4px;border:1px solid var(--border);" />
              </div>
            `
            : ""
        }
      `;

      const btnPrint = document.getElementById("btn-print-doc");
      if (btnPrint) {
        btnPrint.addEventListener("click", () => {
          window.print();
        });
      }

      const btnCopy = document.getElementById("btn-copy-url");
      if (btnCopy) {
        btnCopy.addEventListener("click", () => {
          copyToClipboard(fullVerifyUrl, btnCopy);
        });
      }
    }

    document.getElementById("verify-form").addEventListener("submit", e => {
      e.preventDefault();
      runVerification(input.value);
    });

    updateStaticTexts();
    const params = new URLSearchParams(window.location.search);
    const initialNo = params.get("n") || "UPD-SW-2026-0001";
    runVerification(initialNo);
  </script>
</body>
</html>
