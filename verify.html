<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UPD Official Record Verification — Public Registry</title>
  <link rel="icon" type="image/png" href="./assets/opacidade2.png" />
  <link rel="stylesheet" href="./style.css" />
  <script src="./config.js"></script>
</head>
<body>
  <main class="canvas" style="max-width:760px;margin:0 auto;padding-top:44px;">
    <div class="page-header">
      <div style="display:flex;align-items:center;gap:12px;">
        <img src="./assets/opacidade2.png" alt="UPD Crest" style="width:44px;height:44px;" />
        <div>
          <h1 class="page-title" id="page-title">Public Record Authenticity Registry</h1>
          <p class="page-sub" id="page-sub">Unified Police Department · County of Los Santos · Cryptographic & Control Number Verification</p>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;">
        <button class="btn btn-secondary" id="btn-verify-lang" type="button" style="font-weight:700;">🇧🇷 PT</button>
        <a class="btn btn-secondary" id="btn-back" href="./index.html">Back to Officer Portal</a>
      </div>
    </div>

    <section class="panel">
      <form id="verify-form" style="display:flex;gap:10px;align-items:center;">
        <input
          class="input mono"
          id="verify-input"
          placeholder="Enter Control Number (e.g., UPD-SW-2026-0001 or UPD-FQ-2026-0001)"
          required
        />
        <button class="btn btn-primary" id="btn-submit-verify" type="submit">Verify Record</button>
      </form>
      <div id="verify-caption" style="margin-top:8px;font-size:12px;color:var(--muted);">
        Public verification confirms official issuance and command counter-signature without exposing confidential probable-cause narratives.
      </div>
    </section>

    <div id="verify-result"></div>
  </main>

  <script type="module">
    import { fetchPublicVerifyRecord } from "./api.js?v=6";
    import { t, getLanguage, setLanguage, UI_I18N } from "./i18n.js?v=6";

    const input = document.getElementById("verify-input");
    const resultBox = document.getElementById("verify-result");
    const langBtn = document.getElementById("btn-verify-lang");

    function esc(s) {
      return String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function updateStaticTexts() {
      const lang = getLanguage();
      langBtn.textContent = lang === "pt" ? "🇧🇷 PT" : "🇺🇸 EN";
      document.getElementById("page-title").textContent = t("qrTitle");
      document.getElementById("page-sub").textContent = t("qrSub");
      document.getElementById("btn-back").textContent = t("backToPortal");
      input.placeholder = t("qrPlaceholder");
      document.getElementById("btn-submit-verify").textContent = t("btnVerify");
      document.getElementById("verify-caption").textContent = lang === "pt"
        ? "A verificação pública confirma a autenticidade e contra-assinatura de comando sem expor relatórios confidenciais de causa provável."
        : "Public verification confirms official issuance and command counter-signature without exposing confidential probable-cause narratives.";
    }

    langBtn.addEventListener("click", () => {
      setLanguage(getLanguage() === "pt" ? "en" : "pt");
      updateStaticTexts();
      if (input.value) runVerification(input.value);
    });

    async function runVerification(ctrlNo) {
      const code = (ctrlNo || "").trim().toUpperCase();
      if (!code) return;
      input.value = code;
      const lang = getLanguage();

      const rec = await fetchPublicVerifyRecord(code);

      if (!rec) {
        resultBox.innerHTML = `
          <section class="panel" style="border-color:#f8c6c0;">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
              <h2 class="panel-title">${esc(t("recordNotFound"))}</h2>
              <span class="pill pill-rejected">${lang === "pt" ? "NÃO ENCONTRADO" : "UNVERIFIED"}</span>
            </div>
            <p style="margin:0;color:var(--muted);">
              ${esc(t("notFoundDesc", { code }))}
            </p>
          </section>
        `;
        return;
      }

      const isValid = rec.status === "APPROVED";
      resultBox.innerHTML = `
        <section class="panel">
          <div class="panel-header">
            <div style="display:flex;align-items:center;gap:12px;">
              <img src="./assets/selo.png" alt="Official Seal" style="width:52px;height:52px;" />
              <div>
                <h2 class="panel-title mono">${esc(rec.control_no)}</h2>
                <div class="panel-sub">${esc(rec.document_title)}</div>
              </div>
            </div>
            <span class="pill ${isValid ? "pill-approved" : "pill-revoked"}">
              ${isValid ? esc(t("verifiedValid")) : esc(rec.status)}
            </span>
          </div>

          <table class="data-table">
            <tbody>
              <tr>
                <th style="width:210px;">${lang === "pt" ? "Nº de Controle" : "Control Number"}</th>
                <td class="mono" style="font-weight:600;">${esc(rec.control_no)}</td>
              </tr>
              <tr>
                <th>${lang === "pt" ? "Classificação do Registro" : "Document Classification"}</th>
                <td>${rec.category === "doj" ? (lang === "pt" ? "Processo Judicial DOJ (Tribunal Superior)" : "DOJ Judicial Filing (Superior Court)") : (lang === "pt" ? "Certificação Departamental Interna" : "Internal Departmental Certification")}</td>
              </tr>
              <tr>
                <th>${lang === "pt" ? "Oficial Requerente / Emissor" : "Submitting / Affiant Officer"}</th>
                <td>${esc(rec.issued_by)}</td>
              </tr>
              <tr>
                <th>${lang === "pt" ? "Autoridade de Comando Responsável" : "Approving Command Authority"}</th>
                <td>${esc(rec.approved_by)}</td>
              </tr>
              <tr>
                <th>${lang === "pt" ? "Idioma Oficial do Documento" : "Official Document Language"}</th>
                <td>${(rec.lang || "pt") === "en" ? "🇺🇸 English (US Official Standards)" : "🇧🇷 Português (RP Americano Traduzido)"}</td>
              </tr>
              <tr>
                <th>${lang === "pt" ? "Data e Hora da Autenticação" : "Timestamp of Authentication"}</th>
                <td class="mono">${esc((rec.approved_at || "").slice(0, 19).replace("T", " "))} UTC</td>
              </tr>
              ${
                rec.png_url
                  ? `<tr><th>${lang === "pt" ? "Imagem Oficial (Fivemanage)" : "Official Image (Fivemanage)"}</th><td><a href="${esc(rec.png_url)}" target="_blank" rel="noopener" class="mono" style="color:var(--accent);text-decoration:underline;word-break:break-all;">${esc(rec.png_url)}</a></td></tr>`
                  : ""
              }
              ${
                rec.revocation_note
                  ? `<tr><th>${lang === "pt" ? "Aviso de Revogação" : "Revocation Notice"}</th><td style="color:var(--negative);font-weight:600;">${esc(rec.revocation_note)}</td></tr>`
                  : ""
              }
            </tbody>
          </table>
        </section>
      `;
    }

    document.getElementById("verify-form").addEventListener("submit", e => {
      e.preventDefault();
      runVerification(input.value);
    });

    updateStaticTexts();
    const params = new URLSearchParams(window.location.search);
    const initialNo = params.get("n") || "UPD-SW-2026-0001";
    runVerification(initialNo);
  </script>
</body>
</html>
